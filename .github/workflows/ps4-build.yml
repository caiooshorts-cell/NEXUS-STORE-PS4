name: PS4 homebrew build check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ps4/**"
      - ".github/workflows/ps4-build.yml"

permissions:
  contents: read

jobs:
  toolchain-smoke-test:
    runs-on: ubuntu-latest
    container:
      image: openorbisofficial/toolchain:latest
      options: --user 0
    steps:
      - name: Checkout NEXUS STORE
        uses: actions/checkout@v4

      - name: Fetch official OpenOrbis sample
        run: |
          set -eu
          mkdir -p /tmp/openorbis ps4/smoke-test
          curl -fL https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/archive/refs/heads/master.tar.gz -o /tmp/openorbis.tar.gz
          tar -xzf /tmp/openorbis.tar.gz -C /tmp/openorbis --strip-components=1
          cp -R /tmp/openorbis/samples/hello_world/. ps4/smoke-test/

      - name: Compile sample and create PKG
        run: |
          set -eu
          cd ps4/smoke-test
          make
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp ./*.pkg "$GITHUB_WORKSPACE/dist/"

      - name: Upload smoke-test PKG
        uses: actions/upload-artifact@v4
        with:
          name: nexus-store-openorbis-smoke-test
          path: dist/*.pkg
          if-no-files-found: error
          retention-days: 7
