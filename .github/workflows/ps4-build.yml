name: PS4 homebrew build check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ps4/**"
      - ".github/workflows/ps4-build.yml"

permissions:
  contents: read

jobs:
  prepare-sample:
    runs-on: ubuntu-latest
    steps:
      - name: Download official OpenOrbis sample
        run: |
          set -eu
          mkdir -p bundle/ps4/smoke-test
          curl -fL https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/archive/refs/heads/master.tar.gz -o /tmp/openorbis.tar.gz
          tar -xzf /tmp/openorbis.tar.gz -C /tmp
          cp -R /tmp/OpenOrbis-PS4-Toolchain-master/samples/hello_world/. bundle/ps4/smoke-test/

      - name: Upload sample source
        uses: actions/upload-artifact@v4
        with:
          name: openorbis-sample-source
          path: bundle/ps4/smoke-test/
          if-no-files-found: error
          retention-days: 1

  build-pkg:
    needs: prepare-sample
    runs-on: ubuntu-latest
    container:
      image: openorbisofficial/toolchain:v0.5.1
      options: --user 0
    steps:
      - name: Checkout NEXUS STORE
        uses: actions/checkout@v4

      - name: Download prepared sample
        uses: actions/download-artifact@v4
        with:
          name: openorbis-sample-source
          path: ps4/smoke-test

      - name: Compile sample and create PKG
        run: |
          set -eu
          make -C ps4/smoke-test
          mkdir -p dist
          find ps4/smoke-test -maxdepth 1 -type f -name '*.pkg' -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.pkg' -print -quit)"

      - name: Upload smoke-test PKG
        uses: actions/upload-artifact@v4
        with:
          name: nexus-store-openorbis-smoke-test
          path: dist/*.pkg
          if-no-files-found: error
          retention-days: 7
